name: VM niri smoke

on:
  workflow_dispatch:
    inputs:
      group:
        description: Real-session group
        type: choice
        options: [niri-smoke, niri-emergency]
        default: niri-smoke
      publish:
        description: Publish the tested image (master only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  niri-smoke:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    outputs:
      image-artifact: ${{ steps.publication-assets.outputs.artifact_name }}
    # Step budgets total 166 minutes, including workflow validation and image staging.
    timeout-minutes: 180
    steps:
      - name: Checkout reviewed source
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare this runner VM
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client acl
          test -c /dev/kvm
          mkdir -p .ci-vm/tmp .ci-vm/state
          df -h "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path.cwd() / '.ci-vm'
          config = dict(instance=f'aerial-ci-image-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}',
                        host=os.environ['RUNNER_NAME'], user='tester', storage=str(root / 'state'),
                        guest_root='/home/tester/aerial-ci', memory_mib=4096, cpus=2,
                        build_seconds=2100, group_seconds=600, boot_seconds=300, export_seconds=60)
          (root / 'config.json').write_text(json.dumps(config))
          PY

      - name: Validate workflow
        timeout-minutes: 5
        env:
          TMPDIR: ${{ github.workspace }}/.ci-vm/tmp
          GOCACHE: ${{ github.workspace }}/.ci-vm/go-build
          GOMODCACHE: ${{ github.workspace }}/.ci-vm/go-mod
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/vm-smoke.yml

      - name: Platform contract tests
        timeout-minutes: 2
        env:
          TMPDIR: ${{ github.workspace }}/.ci-vm/tmp
        run: python3 Tests/vm/test_platform.py

      - name: Rebuild the locked Arch image
        timeout-minutes: 55
        env:
          TMPDIR: ${{ github.workspace }}/.ci-vm/tmp
        run: |
          # Device permissions can change between runner steps; acquire at use.
          stat -c '%n mode=%a uid=%u gid=%g inode=%i' /dev/kvm
          getfacl /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          python3 Tests/vm/vm_platform.py build-image --config .ci-vm/config.json \
            --lock Tests/vm/image.lock.json --output-dir .ci-vm/image
          (cd .ci-vm/image && sha256sum -c SHA256SUMS)
          df -h "$GITHUB_WORKSPACE"

      - name: Requested nested niri group
        # Boot, command, SSH/setup, export and stop budgets total 3780s.
        timeout-minutes: 65
        env:
          TMPDIR: ${{ github.workspace }}/.ci-vm/tmp
          TEST_GROUP: ${{ inputs.group }}
        run: |
          stat -c '%n mode=%a uid=%u gid=%g inode=%i' /dev/kvm
          getfacl /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.ci-vm/config.json')
          config = json.loads(path.read_text())
          config['instance'] = f'aerial-ci-niri-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}'
          path.write_text(json.dumps(config))
          PY
          image=.ci-vm/image/aerial-ci-arch-x86_64.qcow2
          expected=$(awk '$2 == "aerial-ci-arch-x86_64.qcow2" { print $1 }' .ci-vm/image/SHA256SUMS)
          python3 Tests/vm/vm_platform.py run-group --config .ci-vm/config.json \
            --image "$image" --sha256 "$expected" --source "$GITHUB_WORKSPACE" \
            --source-revision "$GITHUB_SHA" --group "$TEST_GROUP" --results .ci-vm/results

      - name: Prepare tested publication assets
        if: ${{ inputs.publish && inputs.group == 'niri-smoke' && github.ref == 'refs/heads/master' }}
        timeout-minutes: 2
        id: publication-assets
        env:
          IMAGE_ARTIFACT_NAME: ci-image-transfer-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 Tests/vm/publish_image.py prepare --image-dir .ci-vm/image \
            --results .ci-vm/results --lock Tests/vm/image.lock.json
          printf 'artifact_name=%s\n' "$IMAGE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Stage tested image on GitHub
        if: ${{ inputs.publish && inputs.group == 'niri-smoke' && github.ref == 'refs/heads/master' }}
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.publication-assets.outputs.artifact_name }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            .ci-vm/image/aerial-ci-arch-x86_64.qcow2
            .ci-vm/image/SHA256SUMS
            .ci-vm/image/image-manifest.json
            .ci-vm/image/image.lock.json
            .ci-vm/image/publication.json

      - name: Compact diagnostic results
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-niri-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          include-hidden-files: true
          path: |
            .ci-vm/results/
            .ci-vm/image/image-manifest.json
            .ci-vm/image/SHA256SUMS
            .ci-vm/image/failure.json
            .ci-vm/image/provision.log
            .ci-vm/image/provision-observation.json
            .ci-vm/image/sshd-journal.log
            .ci-vm/image/disk-usage.json
            .ci-vm/image/serial.log
            .ci-vm/image/qemu.log
            .ci-vm/image/ssh-errors.log
            .ci-vm/image/instance.json

      - name: Report measured result
        timeout-minutes: 2
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = Path('.ci-vm/results/summary.json')
          value = json.loads(summary.read_text()) if summary.exists() else {'status': 'INCOMPLETE', 'phase': 'image or boot'}
          total = sum(p.stat().st_size for p in Path('.ci-vm/results').rglob('*') if p.is_file())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## niri VM smoke\n\n')
              stream.write(f'Source: `{os.environ["GITHUB_SHA"]}`\n\n')
              stream.write(f'Image: `{value.get("image_sha256", "not built")}`\n\n')
              stream.write(f'Group: {value.get("group")}; status: {value["status"]}; phase: {value.get("phase")}; exercised: {value.get("exercised", 0)}/{value.get("planned", 0)}; result bytes: {total}\n')
          PY

  publish-image:
    needs: niri-smoke
    if: ${{ inputs.publish && inputs.group == 'niri-smoke' && github.ref == 'refs/heads/master' && needs.niri-smoke.result == 'success' }}
    permissions:
      contents: write
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout tested publisher
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download tested image
        timeout-minutes: 15
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.niri-smoke.outputs.image-artifact }}
          path: publication

      - name: Publish a non-Latest prerelease
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tests/vm/publish_image.py publish --directory publication
